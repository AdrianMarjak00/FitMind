name: Build and Deploy to Firebase Hosting
on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FitMind/package-lock.json

      - name: Install dependencies
        working-directory: ./FitMind
        run: npm ci

      - name: Build Angular
        working-directory: ./FitMind
        run: npx ng build --configuration production

      # Bezplatný hosting (Firebase Spark). Backend už nie je potrebný:
      # dáta idú priamo do Firestore a AI beží v zariadení používateľa.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITMIND_DBA6A }}'
          channelId: live
          projectId: fitmind-dba6a
          entryPoint: ./FitMind
