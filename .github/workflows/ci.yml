name: CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FitMind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FitMind/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test the AI engine
        run: npm test

      - name: Build
        run: npx ng build --configuration production
